name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Backend — pytest
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/firescrapling/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/firescrapling/backend/requirements.txt
            apps/firescrapling/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run pytest
        env:
          # Do not set API_ALLOW_PRIVATE_URLS here — SSRF tests assert the default
          # closed guard. Tests that need localhost/fixture URLs monkeypatch it on.
          API_REQUIRE_AUTH: "true"
          PLAYGROUND_ENABLED: "true"
        run: pytest tests/ -v --tb=short

      - name: Export OpenAPI (regenerate)
        run: python scripts/export_openapi.py

      - name: Fail if openapi.yaml is stale
        working-directory: .
        run: git diff --exit-code -- apps/firescrapling/backend/openapi.yaml

      - name: Upload openapi.yaml artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-yaml
          path: apps/firescrapling/backend/openapi.yaml

  # ---------------------------------------------------------------------------
  # Frontend — tsc + build
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/firescrapling/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/firescrapling/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker build (smoke check — no push)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build --no-cache
