# Alembic config for FireScrapling (SQLAlchemy Core).
# Local/tests: default sqlite via DATABASE_URL or db.default_database_url().
# Compose profile `postgres`: DATABASE_URL=postgresql+psycopg://...

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden in env.py from settings / DATABASE_URL
sqlalchemy.url = sqlite:///data/db/firescrapling.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
